name: JUnit reports

on:
  workflow_call:
    inputs:
      artifact:
        type: string
        required: false
        default: "/^junit-(.+)$/"
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  reports:
    name: Test results
    # Internal PRs and pushes call this workflow from CI. Fork PRs need a trusted
    # workflow_run context because their CI token cannot write GitHub Checks.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Parse uploaded data only; never check out or run code from the tested PR.
      - name: Check out the pinned JUnit reporter
        uses: actions/checkout@v6
        with:
          repository: dorny/test-reporter
          ref: 79b4b4400dc2354b89e9dd811ef9caa9bdd4f665 # Includes retries for checks.update (upstream #867).
          path: .test-reporter
          persist-credentials: false
      - name: Allow a new Check Run to become visible before updating it
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path

          # Upstream retries 404s but sends the first update immediately.
          entry = Path(".test-reporter/dist/index.js")
          source = entry.read_text()
          update = "const resp = await retryOnNotFound(async () => this.octokit.rest.checks.update("
          if source.count(update) != 1:
              raise SystemExit("Review the initial Check Run delay for this reporter version")
          entry.write_text(source.replace(update, "await new Promise(resolve => setTimeout(resolve, 1000));\n" + update))
          PYTHON
      - name: Publish JUnit results in GitHub Checks
        uses: ./.test-reporter
        with:
          artifact: ${{ inputs.artifact || '/^junit-(.+)$/' }}
          name: 'Test results · $1'
          path: '**/*.xml'
          reporter: java-junit
          list-tests: all
          max-annotations: 10
          fail-on-empty: false
          use-actions-summary: false
      - name: Add collapsible test groups to Actions Summary
        if: ${{ !cancelled() }}
        uses: ./.test-reporter
        with:
          artifact: ${{ inputs.artifact || '/^junit-(.+)$/' }}
          name: 'Test results · $1'
          path: '**/*.xml'
          reporter: java-junit
          list-tests: all
          max-annotations: 10
          fail-on-empty: false
          use-actions-summary: true
          collapsed: always
