name: CI
run-name: CI · ${{ github.event.pull_request.title || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_dry_run_version:
        description: "Optional release version X.Y.Z for a read-only check with live changelog generation"
        required: false
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-dry-run:
    name: Release dry run
    if: github.event_name == 'workflow_dispatch' && inputs.release_dry_run_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.8"
      - name: Check release configuration and generate changelogs
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RELEASE_MODEL: ${{ vars.OPENAI_RELEASE_MODEL || secrets.OPENAI_RELEASE_MODEL }}
          RELEASE_VERSION: ${{ inputs.release_dry_run_version }}
        run: |
          test -n "$GH_TOKEN" && test -n "$OPENAI_API_KEY" && test -n "$OPENAI_RELEASE_MODEL"
          gh auth setup-git
          uv run --locked manage.py release prepare --dry-run

  release-identity:
    name: Release CI identity
    if: github.event_name != 'workflow_dispatch' || inputs.release_dry_run_version == ''
    permissions:
      contents: read
      actions: read
    timeout-minutes: 5
    outputs:
      android: ${{ steps.scope.outputs.android }}
      python: ${{ steps.scope.outputs.python }}
      dev-server: ${{ steps.scope.outputs.dev-server }}
      emulator26: ${{ steps.scope.outputs.emulator26 }}
      emulator35: ${{ steps.scope.outputs.emulator35 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 'Comparison base: ${{ github.event.pull_request.base.sha }}'
        run: 'true'
      - name: 'Pull request: ${{ github.event.pull_request.number }}'
        run: 'true'

      - name: Select test suites
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_changes.py

  android:
    name: Android tests and checks
    needs: release-identity
    if: needs.release-identity.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.8"
      - name: Install Android SDK components
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "Android SDK manager is unavailable: $sdkmanager" >&2
            exit 1
          fi
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: uv run --locked manage.py android checks
      - name: Check branding vector conversion
        env:
          MESSAGE487_TEST_ANDROID_VECTORS: "1"
        run: uv run --locked python -m unittest discover -s scripts/tests -p test_generate_branding.py
      - name: Publish test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Android JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-Android JVM
          path: app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 14
      - uses: actions/upload-artifact@v7
        id: apk
        with:
          name: message487-pr-${{ github.event.pull_request.number || github.run_id }}-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        id: release_apk
        with:
          name: message487-pr-${{ github.event.pull_request.number || github.run_id }}-unsigned-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
      - name: Link build artifacts
        env:
          DEBUG_URL: ${{ steps.apk.outputs.artifact-url }}
          RELEASE_URL: ${{ steps.release_apk.outputs.artifact-url }}
        run: |
          echo "[Download debug APK]($DEBUG_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download unsigned release APK]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"

  python:
    needs: release-identity
    if: needs.release-identity.outputs.python == 'true'
    name: Python tests and style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.8"
      - run: uv run --locked manage.py python-checks
      - name: Upload Python JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-Python
          path: test-results/python/**/*.xml
          retention-days: 14

  dev-server:
    name: Development server tests
    needs: release-identity
    if: needs.release-identity.outputs.dev-server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: docker compose -f DevServer/compose.yaml up -d --wait --wait-timeout 300
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.8"
      - run: uv run --locked manage.py server-tests
      - name: Upload n8n JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-n8n
          path: test-results/server/*.xml
          retention-days: 14
      - name: Server logs
        if: failure()
        run: docker compose -f DevServer/compose.yaml logs --tail 150
      - name: Stop server
        if: always()
        run: docker compose -f DevServer/compose.yaml down

  emulator26:
    name: Android emulator API 26
    needs: release-identity
    uses: ./.github/workflows/android-device.yml
    with:
      enabled: ${{ needs.release-identity.outputs.emulator26 == 'true' }}
      api: 26

  emulator35:
    name: Android emulator API 35
    needs: release-identity
    uses: ./.github/workflows/android-device.yml
    with:
      enabled: ${{ needs.release-identity.outputs.emulator35 == 'true' }}
      api: 35

  report-android:
    name: Publish Android JVM results
    needs: android
    if: >-
      !cancelled() && needs.android.result != 'skipped' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/test-reports.yml
    with:
      artifact: '/^junit-(Android JVM)$/'

  report-python:
    name: Publish Python results
    needs: python
    if: >-
      !cancelled() && needs.python.result != 'skipped' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/test-reports.yml
    with:
      artifact: '/^junit-(Python)$/'

  report-dev-server:
    name: Publish n8n results
    needs: dev-server
    if: >-
      !cancelled() && needs.dev-server.result != 'skipped' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/test-reports.yml
    with:
      artifact: '/^junit-(n8n)$/'

  report-emulator26:
    name: Publish Android API 26 results
    needs: [release-identity, emulator26]
    if: >-
      !cancelled() && needs.release-identity.outputs.emulator26 == 'true' && needs.emulator26.result != 'skipped' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/test-reports.yml
    with:
      artifact: '/^junit-(Android API 26)$/'

  report-emulator35:
    name: Publish Android API 35 results
    needs: [release-identity, emulator35]
    if: >-
      !cancelled() && needs.release-identity.outputs.emulator35 == 'true' && needs.emulator35.result != 'skipped' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/test-reports.yml
    with:
      artifact: '/^junit-(Android API 35)$/'
