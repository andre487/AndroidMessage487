name: CI

on:
  workflow_dispatch:
    inputs:
      release_dry_run_version:
        description: "Optional release version X.Y.Z for a read-only check with live changelog generation"
        required: false
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-dry-run:
    name: Release dry run
    if: github.event_name == 'workflow_dispatch' && inputs.release_dry_run_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release configuration and generate changelogs
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RELEASE_MODEL: ${{ vars.OPENAI_RELEASE_MODEL || secrets.OPENAI_RELEASE_MODEL }}
          RELEASE_VERSION: ${{ inputs.release_dry_run_version }}
        run: |
          test -n "$GH_TOKEN" && test -n "$OPENAI_API_KEY" && test -n "$OPENAI_RELEASE_MODEL"
          gh auth setup-git
          python3 scripts/release_automation.py prepare --version "$RELEASE_VERSION" --dry-run

  release-identity:
    name: Release CI identity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 'Comparison base: ${{ github.event.pull_request.base.sha }}'
        run: 'true'
      - name: 'Pull request: ${{ github.event.pull_request.number }}'
        run: 'true'

  android:
    if: github.event_name != 'workflow_dispatch' || inputs.release_dry_run_version == ''
    name: Android tests and checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
      - name: Install Android SDK components
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "Android SDK manager is unavailable: $sdkmanager" >&2
            exit 1
          fi
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: bundle exec fastlane android checks
      - name: Publish test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v7
        id: apk
        with:
          name: message487-builds
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Link build artifacts
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: echo "[Download debug APK and unsigned release APK]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"

  python:
    if: github.event_name != 'workflow_dispatch' || inputs.release_dry_run_version == ''
    name: Python tests and style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: bundle exec fastlane android python_checks

  dev-server:
    if: github.event_name != 'workflow_dispatch' || inputs.release_dry_run_version == ''
    name: Development server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: docker compose -f DevServer/compose.yaml up -d --wait --wait-timeout 300
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
      - run: bundle exec fastlane android server_tests
      - name: Server logs
        if: failure()
        run: docker compose -f DevServer/compose.yaml logs --tail 150
      - name: Stop server
        if: always()
        run: docker compose -f DevServer/compose.yaml down
