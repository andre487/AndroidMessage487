name: Upload Google Play descriptions

on:
  workflow_dispatch:
    inputs:
      metadata_commit:
        description: "Full commit SHA containing the reviewed descriptions for the Play release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: google-play-descriptions
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
      - name: Upload reviewed descriptions
        env:
          PLAY_METADATA_COMMIT: ${{ inputs.metadata_commit }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.SUPPLY_JSON_KEY_DATA }}
        run: bundle exec fastlane android play_metadata
      - name: Next step
        run: echo 'Descriptions uploaded without submission. Check both languages and the matching release in Play Console before sending for review.' >> "$GITHUB_STEP_SUMMARY"
