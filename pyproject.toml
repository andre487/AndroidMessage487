[project]
name = "message487-tools"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["click>=8.1,<9"]

[dependency-groups]
dev = [
    "black==26.10.1",
    "isort==9.0.1",
    "unittest-xml-reporting==4.0.0",
]

[tool.black]
skip-string-normalization = true

[tool.isort]
profile = "black"
